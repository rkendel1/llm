name: Routing Evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/router/**"
      - "packages/registry/**"
      - "packages/providers/**"
      - "registry/**"
      - ".github/workflows/routing-evaluation.yml"
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run evaluate:routing
      - run: npm test
