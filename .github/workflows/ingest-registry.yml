name: Ingest & Normalize Registry

on:
  schedule:
    # Run daily at 2 AM UTC (models update frequently, especially pricing)
    - cron: '0 2 * * *'
    # Run weekly for deeper verification on Sundays
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate candidate without creating a PR"
        required: false
        default: false
        type: boolean
      mode:
        description: "Verification mode"
        required: false
        default: manual
        type: choice
        options: [daily, weekly, manual]

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture Current Registry
        run: npm run registry:capture-baseline

      - name: Run Registry Ingestion
        id: ingest
        run: |
          set -euo pipefail
          npm run ingest:registry
          echo "status=success" >> $GITHUB_OUTPUT
        env:
          NODE_ENV: production
          LOG_LEVEL: info
          INGEST_MODE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' && 'weekly' || github.event_name == 'schedule' && 'daily' || inputs.mode }}
          HF_ENRICHMENT_LIMIT: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0' && '100' || '25' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Validate Candidate
        run: npm run registry:validate

      - name: Run Quality Gate
        run: npm run registry:quality:gate

      - name: Generate Registry Diff
        run: npm run registry:diff

      - name: Generate Registry Report
        id: report
        run: |
          npm run registry:release-report > /tmp/registry-report.txt
          {
            echo "REPORT<<EOF"
            cat registry/snapshots/registry-report.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Promote Candidate Atomically
        if: ${{ inputs.dry_run != true }}
        run: npm run registry:publish-candidate

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: |
            chore(registry): Update model registry via ingestion pipeline

            Auto-ingested registry changes from provider sources.

            **Generated by:** Automated Registry Ingestion Workflow
            **Time:** ${{ github.event.scheduled || 'manual' }}
          branch: registry/ingest-${{ github.run_number }}
          delete-branch: true
          title: 'chore(registry): Update model registry'
          body: |
            ## Registry Update

            This PR contains updates to the model registry from the ingestion pipeline.

            ${{ steps.report.outputs.REPORT }}

            **Generated by:** Automated Registry Ingestion Workflow
            **Triggered:** ${{ github.event_name }}
          assignees: rkendel1
          labels: 'area: registry,automated,registry: quality-passed'

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-ingestion-logs
          path: |
            /tmp/registry-report.txt
            registry/snapshots/candidate.json
            registry/snapshots/candidate.manifest.json
            registry/snapshots/quality-gate.json
            registry/snapshots/registry-diff.json
            registry/snapshots/registry-report.md
          if-no-files-found: ignore
          retention-days: 30
