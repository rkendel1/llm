name: Ingest & Normalize Registry

on:
  schedule:
    # Run daily at 2 AM UTC (models update frequently, especially pricing)
    - cron: '0 2 * * *'
    # Run weekly for deeper verification on Sundays
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Registry Ingestion
        id: ingest
        run: |
          set -euo pipefail
          npm run ingest:registry
          echo "status=success" >> $GITHUB_OUTPUT
        env:
          NODE_ENV: production
          LOG_LEVEL: info
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Generate Registry Report
        if: steps.ingest.outcome == 'success'
        id: report
        run: |
          npm run registry:report > /tmp/registry-report.txt 2>&1
          {
            echo "REPORT<<EOF"
            cat /tmp/registry-report.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: |
            chore(registry): Update model registry via ingestion pipeline

            Auto-ingested registry changes from provider sources.

            **Generated by:** Automated Registry Ingestion Workflow
            **Time:** ${{ github.event.scheduled || 'manual' }}
          branch: registry/ingest-${{ github.run_number }}
          delete-branch: true
          title: 'chore(registry): Update model registry'
          body: |
            ## Registry Update

            This PR contains updates to the model registry from the ingestion pipeline.

            ### Changes Summary
            ```
            ${{ steps.report.outputs.REPORT }}
            ```

            ### Verification Checklist
            - [ ] All models parse correctly
            - [ ] Pricing data is normalized
            - [ ] No duplicate model IDs
            - [ ] All required fields present
            - [ ] Capabilities are valid

            **Generated by:** Automated Registry Ingestion Workflow
            **Triggered:** ${{ github.event_name }}
          assignees: rkendel1
          labels: 'area: registry,automated'

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-ingestion-logs
          path: |
            /tmp/registry-report.txt
            registry/registry-snapshot.json
          if-no-files-found: ignore
          retention-days: 30
